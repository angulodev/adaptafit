<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdaptaFit — ejercicios que sí puedes hacer</title>
<meta name="description" content="Marca tus restricciones y mira qué queda disponible.">
<meta name="theme-color" content="#0F2A1D">
<!-- Archivo generado por ui/build.js. No editar a mano: edita app.jsx y styles.css. -->
<style>
/* AdaptaFit — hoja de estilos propia.
   Sin Tailwind ni fuentes remotas: la app tiene que funcionar sin red. */

:root{
  --ink:#0F2A1D;
  --deep:#375534;
  --mid:#6B9071;
  --soft:#AEC3B0;
  --pale:#E3EED4;
  --paper:#F4F8EC;
  --vacio:#E6E7DF;
  --amber:#7A4E00;
  --amber-bg:#F6E7C4;
  --linea:#CBD9C6;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
p{margin:0}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px;border-radius:6px}

.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.pantalla{padding-bottom:28px}
.pantalla-perfil{padding-bottom:120px}

/* --- tipografía --- */
.h1{
  font-size:clamp(29px,7.6vw,36px); font-weight:800; line-height:1.06;
  letter-spacing:-.022em; margin:10px 0 0;
}
.h2{font-size:19px;font-weight:700;letter-spacing:-.012em;margin:0}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--mid);
}
.lede{margin-top:12px;font-size:15px;color:var(--deep)}
.ayuda{font-size:13.5px;color:var(--mid);margin-top:4px}

.cabecera{padding-top:34px;padding-bottom:22px}
.seccion{margin-bottom:26px}
.seccion .chips{margin-top:12px}

/* --- chips --- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--soft); background:#fff; color:var(--deep);
  border-radius:999px; padding:9px 14px; font-size:14.5px; font-weight:500;
  text-align:left; transition:background .13s,border-color .13s,color .13s;
}
.chip:hover{border-color:var(--mid)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--pale)}
.chip-sm{padding:6px 13px;font-size:13.5px}

/* --- barra inferior --- */
.barra-inf{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  background:var(--paper); border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom);
}
.barra-inf-fila{display:flex;align-items:center;gap:12px;padding-top:11px;padding-bottom:11px}
.cuenta{flex:1;min-width:0}
.cuenta-num{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1}
.cuenta-lbl{font-size:12.5px;color:var(--mid);margin-top:3px}

.btn{
  background:var(--ink); color:var(--pale); border-radius:999px;
  padding:13px 24px; font-size:15px; font-weight:600;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ancho{display:block;width:100%;margin-top:20px;text-align:center}

/* --- resultados --- */
.cabecera-res{display:flex;align-items:flex-start;gap:12px;padding-top:22px;padding-bottom:8px}
.cabecera-res .chip{flex-shrink:0}
.cabecera-res .cuenta-num{font-size:27px}

.mapa{margin-top:6px}
.mapa-toggle{display:flex;justify-content:center;gap:6px;margin-bottom:4px}
.mapa-svg{width:100%;max-height:44vh;display:block}
.silueta{fill:#fff;stroke:var(--soft);stroke-width:1.5}
.zona{cursor:pointer;transition:opacity .15s}
.zona:hover{opacity:.82}

.leyenda{
  display:flex;justify-content:center;gap:14px;margin-top:2px;
  font-family:var(--mono);font-size:11px;color:var(--deep);
}
.leyenda li{display:flex;align-items:center;gap:5px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:inline-block}

.filtros{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:18px}
.filtros-num{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mid)}

/* --- lista de ejercicios --- */
.lista{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ej{
  width:100%; display:flex; align-items:center; gap:12px; text-align:left;
  background:#fff; border:1px solid var(--linea); border-radius:14px; padding:13px;
  transition:border-color .13s;
}
.ej:hover{border-color:var(--mid)}
.ej-dif{
  flex-shrink:0; width:36px; height:36px; border-radius:10px;
  display:grid; place-items:center; background:var(--pale); color:var(--deep);
  font-family:var(--mono); font-size:13px; font-weight:600;
}
.ej-txt{min-width:0;flex:1}
.ej-nom{
  display:block; font-size:15px; font-weight:500; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ej-meta{display:block;font-size:12.5px;color:var(--mid);margin-top:2px}
.ej-aviso{
  flex-shrink:0; font-family:var(--mono); font-size:11px; padding:4px 9px;
  border-radius:999px; background:var(--amber-bg); color:var(--amber);
}

.vacio{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:24px;text-align:center}
.vacio-tit{font-weight:600}
.vacio .ayuda{margin-top:6px}
.mas{text-align:center;font-size:13px;color:var(--mid);padding:12px 0}

/* --- ficha --- */
.velo{
  position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end;
  justify-content:center; background:rgba(15,42,29,.45);
}
.hoja{
  width:100%; max-width:560px; background:var(--paper);
  border-radius:24px 24px 0 0; padding:18px 20px 32px;
  max-height:86vh; overflow-y:auto;
  animation:sube .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes sube{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.asa{width:40px;height:4px;border-radius:99px;background:var(--soft);margin:0 auto 16px}
.hoja-titulo{font-size:24px;margin:6px 0 4px}

.aviso{background:var(--amber-bg);border-radius:14px;padding:16px;margin-top:18px}
.aviso-tit{font-weight:600;font-size:14px;color:var(--amber)}
.aviso-lista{margin-top:8px;color:var(--amber);font-size:14px}
.aviso-lista li{padding-left:14px;position:relative;margin-top:3px}
.aviso-lista li::before{content:"·";position:absolute;left:4px}
.aviso-pie{font-size:12.5px;color:var(--amber);margin-top:10px}

.bloque{margin-top:18px}
.bloque-tit{font-weight:600;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--pale);color:var(--deep)}

.pie-tecnico{
  margin-top:20px; padding-top:14px; border-top:1px solid var(--linea);
  font-family:var(--mono); font-size:12px; color:var(--mid);
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

</style>
</head>
